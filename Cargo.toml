[package]
name = "mini-drive"
version = "2.0.0"
edition = "2021"
description = "零认证简易云盘：Rust 后端 + Svelte 前端"
license = "MIT"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"
urlencoding = "2"

[profile.release]
opt-level = 2
strip = true
